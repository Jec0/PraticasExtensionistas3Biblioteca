name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Verificação e testes automatizados
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: codigo

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: codigo/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar a configuração do projeto
        run: python manage.py check

      - name: Conferir migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Executar os testes automatizados
        run: python manage.py test --verbosity 2
