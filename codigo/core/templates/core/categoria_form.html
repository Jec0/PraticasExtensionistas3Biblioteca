{% extends "core/base.html" %}
{% block title %}{% if categoria %}Editar{% else %}Nova{% endif %} categoria - {{ config.nome }}{% endblock %}
{% block content %}
<div class="card" style="max-width:460px">
  <h1 style="margin-bottom:1rem">{% if categoria %}Editar categoria{% else %}Nova categoria{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Salvar</button>
    <a class="btn secondary" href="{% url 'categoria_list' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
